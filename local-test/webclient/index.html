<!doctype html>
<html>
  <head><meta charset="utf-8"><title>local echo test</title></head>
  <body>
    <p>SIP.js echo test against the local Asterisk container.</p>
    <script>
      // Overridable via ?ws=ws://host:port/ws so the same bundle works both
      // from the host (NAT'd) and from inside the shared Docker network.
      const params = new URLSearchParams(window.location.search);
      window.__WS_SERVER__ = params.get("ws") || "ws://127.0.0.1:18088/ws";
    </script>
    <script src="test-bundle.js"></script>
  </body>
</html>
